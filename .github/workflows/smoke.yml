name: Smoke (real model, slow lane)

on:
  workflow_dispatch:
    inputs:
      wav:
        description: 'Path to a test WAV file inside the repo (optional; defaults to the bundled regression fixture)'
        required: false
        default: 'test/fixtures/voice-zh-16k.wav'
      expected:
        description: 'Optional expected text file path'
        required: false
        default: ''
  # tag / 发布前自动触发（评审 OV-2）：保持慢速 lane 不拖累每次 PR。
  # 只挂 tag push：GitHub UI 建 Release 也会创建 tag 并触发本事件；若同时挂
  # `release: published`，一次发布会跑两遍（每遍要下 ~230MB 模型）。
  push:
    tags:
      - 'v*'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Download model
        run: node tools/download-model.mjs

      - name: Run real-model smoke
        env:
          SMOKE_WAV: ${{ github.event.inputs.wav || 'test/fixtures/voice-zh-16k.wav' }}
        run: node scripts/smoke.mjs "$SMOKE_WAV" "${{ github.event.inputs.expected }}"
